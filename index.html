<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaronSoftware | خانه</title>
    <link rel="icon" href="csoft.png">
    <style>
        :root {
            --primary-red: #d32f2f;
            --dark-bg: #121212;
            --text-white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-white);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* Use min-height to allow content to push footer down */
            padding-bottom: 60px; /* Add padding to body to prevent content from being hidden by the footer */
            box-sizing: border-box; /* Include padding in height calculation */
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            color: var(--primary-red);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .cta-button {
            background-color: var(--primary-red);
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .cta-button:hover {
            background-color: #b71c1c;
        }

        .header-controls {
            position: absolute;
            top: 20px;
            left: 20px; /* Position on the left for LTR languages, or adjust if needed for RTL */
            display: flex;
            gap: 10px;
        }

        .lang-switch-button {
            background: none;
            border: 1px solid var(--text-white);
            color: var(--text-white);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .lang-switch-button:hover {
            background: var(--primary-red);
            border-color: var(--primary-red);
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(18, 18, 18, 0.8); /* Slightly transparent dark background */
            color: var(--text-white);
            text-align: center;
            padding: 15px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="header-controls">
        <button class="lang-switch-button">English</button>
    </div>

    <h1>CaronSoftware</h1>
    <p>ابزارهایی برای آینده. آخرین پروژه ما را ببینید.</p>
    
    <a href="TBFM" class="cta-button">دانلود TBFM</a>

    <footer class="footer">
        © 2024 CaronSoftware. تمامی حقوق محفوظ است.
    </footer>

    <script>
        // Basic JavaScript for language switching - this would need more logic for actual content change
        const langSwitchButton = document.querySelector('.lang-switch-button');
        const mainHeading = document.querySelector('h1');
        const mainParagraph = document.querySelector('p');
        const tbfmButton = document.querySelector('.cta-button');
        const footerText = document.querySelector('.footer');

        let isPersian = true;

        langSwitchButton.addEventListener('click', () => {
            if (isPersian) {
                // Switch to English
                mainHeading.textContent = 'CaronSoftware';
                mainParagraph.textContent = 'Developing tools for the future. Check out our latest project.';
                tbfmButton.textContent = 'Download TBFM';
                footerText.textContent = '© 2024 CaronSoftware. All rights reserved.';
                document.documentElement.lang = 'en'; // Update HTML lang attribute
                document.documentElement.dir = 'ltr'; // Set direction to LTR for English
                langSwitchButton.textContent = 'فارسی';
            } else {
                // Switch to Persian
                mainHeading.textContent = 'CaronSoftware'; // Keep it consistent or change if needed
                mainParagraph.textContent = 'ابزارهایی برای آینده. آخرین پروژه ما را ببینید.';
                tbfmButton.textContent = 'دانلود TBFM';
                footerText.textContent = '© 2024 CaronSoftware. تمامی حقوق محفوظ است.';
                document.documentElement.lang = 'fa'; // Update HTML lang attribute
                document.documentElement.dir = 'rtl'; // Set direction to RTL for Persian
                langSwitchButton.textContent = 'English';
            }
            isPersian = !isPersian;
        });
    </script>

</body>
</html>
